# The three starts (DESIGN §15). Attributes total 11 (the point-buy pool, each 1-5); three skill sets of 7 points each, the first the default (docs/FRAME-LINEAGE.md A).
# The younger son and the freedman's son start on the Raven's benches; the outlaw joins her at Birsay (docs/FRAME-BEGINNINGS.md).
- id: younger_son
  label: The younger son
  desc: A bóndi's second son. The farm goes to your brother. Everything else you will have to take.
  patronymic: Hallsson
  father: Hall
  attrs: { str: 3, agi: 2, end: 2, wit: 2, pre: 2 }
  skill_sets:
    - id: sword
      label: Raised to the sword
      desc: Your father put a spear in your hand at six and a shield on your arm at ten. You know the front of a wall.
      skills: { weapons: 2, shield: 2, seamanship: 1, command: 1, speech: 1 }
    - id: oar
      label: Raised to the steering-oar
      desc: Your uncle took you fishing to the outer skerries every summer. You read weather and you can make men pull.
      skills: { seamanship: 3, command: 2, weapons: 1, shield: 1 }
    - id: table
      label: Raised at the jarl's table
      desc: You were fostered two winters in the jarl's hall. You know the old poems, the families, and when a man is lying.
      skills: { speech: 2, lore: 2, cunning: 1, weapons: 1, shield: 1 }
  honour: 1
  silver: 0
  men: [ketill, ulf, hallvard, bersi]
  crew: 36
  ship: snekkja
  start_scene: b_ship_home
  service: { captain: Ásgeir, ship_name: the Raven }
- id: outlaw
  label: The outlaw
  desc: You killed a man at the spring horse-fight, at sixteen, and the Thing put you out of Hordaland for three winters. You have a deed already, a blood feud, and no harbour to call home.
  patronymic: Grímsson
  father: Grímr
  attrs: { str: 3, agi: 3, end: 2, wit: 2, pre: 1 }
  skill_sets:
    - id: killer
      label: The killer
      desc: The horse-fight was not your first fight. It was only the first one men saw.
      skills: { weapons: 3, shield: 2, cunning: 1, seamanship: 1 }
    - id: poacher
      label: The poacher
      desc: You lived off other men's game and other men's boats long before the Thing put you out.
      skills: { cunning: 3, seamanship: 2, weapons: 2 }
    - id: talker
      label: The talker
      desc: You talked your way out of the hanging. You can talk your way into most other things.
      skills: { speech: 3, cunning: 2, weapons: 2 }
  honour: -2
  silver: 12
  flags: [outlawed]
  men: []
  crew: 8
  ship: knarr
  start_scene: o_horses
  service: { captain: Þórir, ship_name: "Þórir's knarr" }
- id: freedman
  label: The freedman's son
  desc: Your father was born a thrall on Hrapp's farm, and your grandmother was taken from Ireland in the first year of the ships. You know boats, a little Irish, and men remember where your family came from.
  patronymic: Leysingsson
  father: Leysingr
  attrs: { str: 2, agi: 2, end: 3, wit: 3, pre: 1 }
  skill_sets:
    - id: boatwright
      label: The boatwright's boy
      desc: You grew up in the yard among the strakes and the rivets. You know a hull by its sound.
      skills: { seamanship: 3, craft: 2, weapons: 1, shield: 1 }
    - id: trader
      label: The trader's boy
      desc: Your father sold Hrapp's wool at Kaupang, and you carried the scales. You know what a thing is worth, and what a man will pay.
      skills: { trade: 3, speech: 2, seamanship: 2 }
    - id: grandmother
      label: The Irish grandmother's grandson
      desc: She taught you her tongue, her saints, and how to listen at a door. You know more about the west than any man on the benches.
      skills: { cunning: 2, lore: 1, speech: 1, seamanship: 1, weapons: 1, craft: 1 }
  honour: 0
  silver: 18
  flags: [leysingi]
  men: [ketill, ulf, hallvard, bersi]
  crew: 36
  ship: snekkja
  start_scene: f_yard
  service: { captain: Ásgeir, ship_name: the Raven }
