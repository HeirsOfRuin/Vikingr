# The Seine (docs/FRAME-IRELAND-SEINE.md). History: in May 841 a fleet under "Oscherus" (Ásgeir) came up the
# Seine, sacked Rouen, burned Jumièges, took six pounds from Fontenelle to spare it, and sold back sixty-eight
# captives to the monks of Saint-Denis for twenty-six pounds. At Easter 845 Ragnarr ("Reginherus") came up the
# river with a hundred and twenty ships, beat half of King Charles's army, hanged a hundred and eleven prisoners
# on an island in sight of the other half, sacked Paris, and was paid seven thousand pounds of silver to go.
# A flux went through his fleet on the way home.

# ---- 841: Rouen ----
- id: sn_rouen
  kind: place
  trigger: arrive
  at: [rouen]
  once: true
  weight: 20
  requires: ["year == 841", "month <= 8", "!service"]
  art: muster
  title: Rouen, in May
  text: |
    [if flag.sn_841_sworn]
    You come up the Seine with the fleet around you: more ships than you can count in one look, three days up the river between orchards and abbeys, with the Franks running from the banks ahead of you like birds from a scythe.
    [else]
    You find the fleet already in the river below Rouen, more ships than you can count in one look, and their captains glad of another.
    [/if]
    [if fate.asgeir_falls && !flag.bg_covered]
    The Dane Ásgeir leads them: a tall, quiet man with a Frankish sword. The Franks will call him Oscherus, and write it down.
    [elif fate.asgeir_falls]
    Ásgeir leads them from his steering-oar, because he can't stand in the line any more. He watches you come alongside, and grins with half his teeth. "The Franks call me Oscherus," he says. "They're writing it down. Make sure they spell you right."
    [else]
    Ásgeir leads them: grey-bearded, broad, the same man who put you at his oar when you were sixteen. He watches you come alongside, and nods once, which from Ásgeir is a speech. "The Franks call me Oscherus," he says. "They'll write it in their books. Let's give them something to write."
    [/if]

    Rouen stands on its bank behind its old Roman walls. The count's men are drawn up in front of the river gate, in mail. Not many. The rest, they say, are off fighting for one of the emperor's sons against another.
  choices:
    - id: line
      text: Take your place in the line, and go at the river gate.
      danger: true
      effects:
        - { set: flag.sn_841_sworn }
        - { host: { title: "The river gate at Rouen", foe: frankish_levy, terrain: field, men: 30, wings: [ { name: "Ásgeir's crews", men: 120, foe_men: 50 }, { name: "The Danish crews", men: 90, foe_men: 40 } ], role: wing, reserve: { us: 30, them: 20 }, raid: true, win: sn_rouen_won, lose: sn_rouen_lost } }
      result: The horn goes, and the whole fleet comes ashore at once, and the count's men lock shields in front of the gate.
    - id: gate
      text: Take your crew round to the open gate on the quay that you found last time.
      visible_if: "flag.rouen_scouted"
      danger: true
      effects:
        - { set: flag.sn_841_sworn }
        - { host: { title: "Through the quay gate at Rouen", foe: frankish_levy, terrain: field, men: 12, wings: [ { name: "Ásgeir's crews", men: 120, foe_men: 50 }, { name: "The Danish crews", men: 90, foe_men: 40 } ], role: wing, reserve: { us: 30, them: 10 }, raid: true, win: sn_rouen_won, lose: sn_rouen_lost } }
      result: While the fleet goes at the river gate, you take your men along the quay to the little gate you saw the boatmen use, and find it open, as it was before. A dozen of the count's men see you coming, and only a dozen.
    - id: ships
      text: Stay with the ships. Somebody has to.
      effects: [ { set: flag.sn_841_sworn }, { add: { loot: 60, honour: -1, crew.morale: -1 } }, { queue: { scene: sn_abbeys, days: 3 } } ]
      result: You guard the ships, which is a real job, and get a ship-guard's share, which is a small one. Your men watch the smoke go up over the city and say nothing to you at all.

- id: sn_rouen_won
  kind: spine
  art: iona_burning
  title: Rouen burns
  text: |
    Rouen is yours, for as long as it takes. The archbishop is gone, and the count, and most of the people, out through the far gate with whatever they could carry. What they couldn't carry is still here.

    By evening the city is burning, one quarter at a time, and the fleet is loading.
  choices:
    - id: on
      text: Down the river, to the abbeys.
      effects: [ { deed: { type: raid, text: "Sacked Rouen with Ásgeir's fleet", weight: 4, witnesses: 400 } }, { queue: { scene: sn_abbeys, days: 2 } } ]
      result: Ásgeir sends word along the ships. The abbeys below the city, Jumièges and Fontenelle, are next. Then the monks of Saint-Denis, who are already on their way down the river with silver, to buy back their people.

- id: sn_rouen_lost
  kind: spine
  art: muster
  title: The river gate
  text: |
    The count's men hold the gate longer than anyone expected, and your stretch of the line breaks first. You get back to the ships with fewer men than you left them with. By evening, the rest of the fleet has gone round and taken the city anyway, from the side you weren't on.
  choices:
    - id: on
      text: Follow the fleet down to the abbeys, for what's left.
      effects: [ { add: { loot: 60 } }, { queue: { scene: sn_abbeys, days: 2 } } ]
      result: Ásgeir doesn't say anything about the gate. He doesn't need to. Your share of Rouen is a small one.

- id: sn_abbeys
  kind: queued
  art: iona_burning
  title: The abbeys below Rouen
  text: |
    Going back down the river, the fleet splits round the two great abbeys.

    At Jumièges the monks have run, and left the barns full and the church open. The Danes are already carrying torches to it.

    At Fontenelle the abbot is waiting at his landing with a chest, a list, and a monk to interpret. Six pounds of silver, he offers, if the fleet will leave his house standing. He has clearly been counting the fleet all the way down the river, and the silver all the way up.
  choices:
    - id: jumieges
      text: Go with the Danes to Jumièges. Burn it, and take what's in the barns.
      effects: [ { add: { loot: 220 } }, { standing: { people: frankish, n: -2 } }, { deed: { type: raid, text: "Burned Jumièges", weight: 2 } }, { queue: { scene: sn_captives, days: 2 } } ]
      result: |
        It burns for two days. The smoke goes up over the loop of the river so high it can be seen from Rouen. You take grain, wine, cloth, a gilded cross, and a great many horses, which nobody aboard knows how to ship.
    - id: fontenelle
      text: Stand with Ásgeir at Fontenelle, and take the abbot's six pounds.
      effects: [ { add: { loot: 100 } }, { deed: { type: deed, text: "Took the abbot of Fontenelle's silver to spare his house", weight: 1 } }, { queue: { scene: sn_captives, days: 2 } } ]
      result: The abbot counts out six pounds of silver on the landing, coin by coin, and writes it down. Ásgeir divides it among the ships there and then, two pounds to the Raven, and the abbey stands. In the abbey's book, you learn later, it says what was paid, and to whom, and on what day. Monks write everything down.

- id: sn_captives
  kind: queued
  art: muster
  title: The monks of Saint-Denis
  text: |
    At the river mouth, a boat comes down after the fleet with monks in it, under a green branch: from Saint-Denis, upriver beyond Paris, sent by their abbot. They have silver. They want to buy back the people the fleet took on the Seine: sixty-eight of them, in all the ships, and they have a list with names on it.

    The price is less than a slave would fetch in Hedeby. But Hedeby is a long way, and captives die on the way.
  choices:
    - id: sell
      text: Sell yours back to the monks.
      requires: ["captives >= 1"]
      effects: [ { sell_captives: 20 }, { add: { honour: 1 } }, { standing: { people: frankish, n: 1 } } ]
      result: The monks read out names, and people stand up in the bilge and go to them. Some of them are weeping. The monks pay without arguing, and write it all down.
    - id: keep
      text: Keep them for the markets in the north.
      result: The monks go to the next ship, and the next. Some of your captives watch them go, until the boat is out of sight.
    - id: free
      text: Give yours to the monks for nothing. You've had enough of the Seine for one year.
      requires: ["captives >= 1"]
      effects: [ { captives: -99 }, { add: { honour: 2 } }, { standing: { people: frankish, n: 2 } } ]
      result: The monks don't understand at first. Then one of them takes your hand and kisses it, which embarrasses everyone. Ásgeir, watching from his ship, shakes his head slowly, and is smiling.

# ---- 845: Paris ----
- id: sn_845
  kind: phase
  trigger: phase_start
  once: true
  weight: 10
  requires: ["year >= 845", "year <= 846", "place == home_fjord", "phase == muster", "!service", "ships >= 1"]
  art: muster
  when: Spring, 845
  title: Ragnarr's war-arrow
  text: |
    The split arrow comes up the fjord in a Danish ship before the ice is well out of the inner fjord. Ragnarr is going up the Seine, all the way, to Paris. A hundred and twenty ships. King Charles is fighting his brothers and the Bretons and his own lords, and Ragnarr means to be in the river before any of them notice.

    He's heard of you. The messenger makes sure you know that he has heard of a great many people, and that most of them are coming.
    [if seen.sn_rouen]

    Rouen, then Paris. You know the river now.
    [/if]
  choices:
    - id: go
      text: Send back your mark on the arrow. Paris.
      effects: [ { set: flag.sn_845_sworn }, { fleet: seine845 }, { know: rouen }, { know: paris }, { know: walcheren }, { add: { crew.morale: 2 } } ]
      result: The whole district hears about it by evening. Men come to your muster from two valleys over, wanting to go to Paris. Everybody wants to go to Paris.
    - id: no
      text: Ragnarr has enough ships. Let him go without yours.
      result: The messenger shrugs, and goes on to the next fjord. All summer long, the news comes back up the coast a piece at a time, and every piece of it is bigger than the last.

- id: sn_paris
  kind: place
  trigger: arrive
  at: [paris]
  once: true
  weight: 20
  requires: ["year == 845", "month <= 8", "!service"]
  art: muster
  title: Paris
  text: |
    Ragnarr's fleet fills the river from bank to bank below the city: a hundred and twenty ships, more men than you have ever seen in one place. Ragnarr himself is a big, plain, cheerful man who remembers your name, or pretends to.

    King Charles has come with an army, and has made a mistake: he's split it, half on each bank, to guard both, with the river between them. Ragnarr looks at the nearer half for a long while, and then at you, and then at his captains.

    "That one," he says.
  choices:
    - id: line
      text: Take your place in Ragnarr's line.
      danger: true
      effects:
        - { set: flag.sn_845_sworn }
        - if: "fame.living >= 120"
          then: [ { host: { title: "The king's army on the bank", foe: frankish_levy, terrain: field, men: 60, wings: [ { name: "Ragnarr's Danes", men: 240, foe_men: 160 }, { name: "The Northmen of Vestfold", men: 140, foe_men: 100 } ], role: wing, reserve: { us: 60, them: 40 }, win: sn_paris_hanging, lose: sn_paris_lost } } ]
          else: [ { host: { title: "The king's army on the bank", foe: frankish_levy, terrain: field, men: 40, wings: [ { name: "Ragnarr's Danes", men: 240, foe_men: 160 }, { name: "The Northmen of Vestfold", men: 140, foe_men: 100 } ], role: man, reserve: { us: 60, them: 40 }, win: sn_paris_hanging, lose: sn_paris_lost } } ]
      result: The horn goes. The fleet comes ashore on the near bank, and the Franks on the far bank stand and watch it happen, with the river between them and their king's other half.
    - id: ships
      text: Hold the ships with the ship-guard.
      effects: [ { set: flag.sn_845_sworn }, { add: { honour: -1, crew.morale: -1 } }, { queue: { scene: sn_danegeld, days: 20 } } ]
      result: Somebody has to hold the ships. Ragnarr thanks you for it, with a smile that says he will remember exactly who held the ships.

- id: sn_paris_hanging
  kind: spine
  art: iona_burning
  title: The island
  text: |
    The king's near half breaks, and runs, and the fleet takes a hundred and eleven prisoners.

    Ragnarr has them taken out to an island in the river, in plain sight of the other half of the Frankish army on the far bank, and hanged, one at a time, from the trees and from ship's masts set up for the purpose, while the Franks watch. For Odin, Ragnarr says. And so that King Charles knows exactly what kind of men are in his river.

    It takes all afternoon. The Franks on the far bank don't move.
  choices:
    - id: ropes
      text: Haul on the ropes with Ragnarr's men. Odin is watching.
      effects: [ { add: { hamingja: 1, honour: -1 } }, { deed: { type: deed, text: "Hanged the king's men for Odin on the island below Paris", weight: 3, witnesses: 2000 } }, { queue: { scene: sn_paris_sack, days: 1 } } ]
      result: |
        You haul. Your men haul with you. When it's done, the river is very quiet, and the Franks on the far bank are gone, back towards Paris, in no order at all. Ragnarr was right. You hate that he was right.
    - id: watch
      text: Stand with your men, and watch, and say nothing.
      effects: [ { queue: { scene: sn_paris_sack, days: 1 } } ]
      result: You watch it all. So do your men. Some of them are grinning. Some of them are very carefully not looking at anything. At the end, one of the young ones is sick over the side, and nobody laughs at him.
    - id: speak
      text: Tell Ragnarr a hanged man pays no ransom.
      check: { skill: speech, attr: pre, difficulty: 7 }
      success:
        text: Ragnarr laughs, and thinks about it, and lets you have a dozen of them, the ones in good cloaks, to sell back. The rest he hangs anyway. You've saved twelve men and made Ragnarr think you're a merchant. Both are worth something.
        effects: [ { captives: 12 }, { add: { honour: 1 } }, { queue: { scene: sn_paris_sack, days: 1 } } ]
      failure:
        text: Ragnarr looks at you for a long moment. "Odin doesn't take silver," he says. His men laugh. The hanging goes on.
        effects: [ { add: { crew.morale: -1 } }, { queue: { scene: sn_paris_sack, days: 1 } } ]

- id: sn_paris_lost
  kind: spine
  art: muster
  title: The bank below Paris
  text: |
    Your stretch of Ragnarr's line goes back into the river, and you lose men in the water, and the Franks cheer. But the rest of the line holds, and then pushes, and by evening the king's near half is broken anyway, and Ragnarr is hanging prisoners on an island, and the city is open.
  choices:
    - id: on
      text: Follow the fleet up to the city.
      effects: [ { add: { crew.morale: -1 } }, { queue: { scene: sn_paris_sack, days: 1 } } ]
      result: Ragnarr doesn't mention your stretch of the line. His captains do, among themselves, where you can hear.

- id: sn_paris_sack
  kind: queued
  art: iona_burning
  title: Easter in Paris
  text: |
    It's Easter, the Christians' greatest feast, and the city on its island is empty: the count gone, the bishop gone, the people gone, the doors open. The monks of Saint-Germain have carried their saint away into the country. The bells are silent.

    The fleet takes Paris without a fight, and spreads out through it, and through the abbeys on both banks, like water through a broken dam.
  choices:
    - id: city
      text: Take your crews into the city, and strip it.
      effects: [ { add: { loot: 400 } }, { captives: 6 }, { standing: { people: frankish, n: -3 } }, { deed: { type: raid, text: "Sacked Paris at Easter with Ragnarr's fleet", weight: 6, witnesses: 2000 } }, { queue: { scene: sn_danegeld, days: 10 } } ]
      result: You find the cathedral's plate hidden under the floor of a priest's house, because the priest's servant shows you where for a share of it. You find wine, and cloth, and a great deal of lead from the church roofs, which is heavy and worth a fortune. Your ships go low in the water.
    - id: abbey
      text: Take your crews across to the abbey of Saint-Germain, where the monks left in a hurry.
      effects: [ { add: { loot: 320 } }, { standing: { people: frankish, n: -2 } }, { deed: { type: raid, text: "Plundered Saint-Germain at Paris with Ragnarr's fleet", weight: 5, witnesses: 2000 } }, { queue: { scene: sn_danegeld, days: 10 } } ]
      result: The monks took the saint. They didn't take the barns, or the wine cellar, or the silver candlesticks they buried in the garden, which a dog finds for you. Your men drink the abbot's wine for three days.

- id: sn_danegeld
  kind: queued
  art: muster
  title: Seven thousand pounds
  text: |
    King Charles doesn't fight again. He sends messengers instead, and then lords, and then more lords, and in the end he pays.

    Seven thousand pounds of silver. It comes down to the river in carts, under guard, and is weighed out on the bank on scales the size of a door, for a whole day, while the fleet watches. Ragnarr swears by his gods, in front of the king's men, that he'll never come back up the Seine. Everyone knows what that's worth.

    Then it's divided: by the ship, and then by the man.
  choices:
    - id: share
      text: Take your ships' share, and go home rich.
      effects:
        - if: "ships >= 3"
          then: [ { add: { geld: 4800 } } ]
          else:
            - if: "ships >= 2"
              then: [ { add: { geld: 3200 } } ]
              else: [ { add: { geld: 1600 } } ]
        - { deed: { type: deed, text: "Was at Paris when King Charles paid seven thousand pounds", weight: 6, witnesses: 2000 } }
        - { envy: 2 }
        - { queue: { scene: sn_flux, days: 15 } }
      result: |
        [if ships >= 3]
        Your three ships take a hundred pounds between them, near enough. You've never seen so much silver in one place, and you've seen a great deal of silver.
        [elif ships >= 2]
        Your two ships take nearly seventy pounds between them. Your men keep picking up the bags to feel the weight.
        [else]
        Your ship's share is a little over thirty pounds of silver. Thirty pounds, for one summer. Your men keep laughing, at nothing.
        [/if]

- id: sn_flux
  kind: queued
  art: open_sea
  title: The flux
  text: |
    It starts on the way down the river: one man, then a dozen, then whole crews, doubled over at the rail, burning with fever and losing their insides. The flux. The Franks are saying it's the saint of Saint-Germain, taking his revenge. Your men are saying the same, more quietly.

    Ragnarr's own ship is quiet. They say he's sick too.
  choices:
    - id: shore
      text: Put ashore, burn the foul straw, and keep the sick apart from the well.
      check: { skill: lore, attr: wit, difficulty: 5 }
      success:
        text: You lose ten days, and four men. The fleet loses hundreds. When you come out of the river mouth into clean sea air, your ships are the only ones still rowing in time.
        effects: [ { add: { crew.men: -4 } }, { days: 10 } ]
      failure:
        text: It doesn't help much. You lose ten days, and ten men, and you bury them on a Frankish beach with their share of the silver under their heads, because nobody wants to take it.
        effects: [ { add: { crew.men: -10, crew.morale: -1 } }, { days: 10 } ]
    - id: push
      text: Row on for the sea. Clean air will cure it, or it won't.
      effects: [ { add: { crew.men: -8, crew.morale: -2 } } ]
      result: You row on, and throw the dead over the side as they die, and by the time you're out of the river you've lost eight men and the rest are grey and shaking. The silver doesn't weigh any less.
    - id: blot
      text: Sacrifice to Odin for the sick, with Frankish silver, as Ragnarr did with Frankish men.
      effects: [ { add: { hamingja: 1, silver: -48, crew.men: -6 } } ]
      result: It may help. You lose six men, which is fewer than some. The men believe it helped, which is nearly as good.
