# PLACEHOLDER hall scenes for the Phase 1 engine build.
- id: p1_winter_quarrel
  kind: pool
  placeholder: true
  trigger: hall
  chance: 0.25
  cooldown_days: 300
  title: A quarrel at the benches
  text: |
    [Placeholder.] Thorgils Hrappsson has been drinking since noon. He says, loud enough for the hall, that your summer was a fishing trip with swords.
  choices:
