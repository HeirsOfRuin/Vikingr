  choices:
    - id: ok
      text: Go back to the benches.
      effects: [ { add: { honour: 1 } } ]
- id: p1_holm_lost
  kind: spine
  placeholder: true
  title: After the holmgang
  text: |
    [Placeholder.] You wake on a bench with your head bound. Thorgils is telling it again, and it gets better every time.
