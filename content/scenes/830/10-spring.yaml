# Spring 831 (FRAME-PHASE2 §2.9): the gate result. The chapter card has already said where he stands;
# this is where he chooses how to go on. The four bench-mates decide whether to come with him.
- id: sp_831
  kind: phase
  trigger: phase_start
  once: true
  requires: ["year >= 831", "place == home_fjord", "phase == muster", "!flag.placeholder_start"]
  art: muster
  when: Spring, 831
  title: The ice goes out
  text: |
    The ice goes out of the fjord in a single night, with a noise like thunder a long way off, and in the morning the water is black and open all the way to the sea.

    You are seventeen. You have one summer behind you, and a scar or two, and a name the district has started to use. You haven't a ship, and nobody on the landing expects you to.
    [if flag.bg_acclaimed]
    Steinarr is mustering the Raven on the jarl's landing. He sends a boy up to the farm to say the prow is still yours if you want it, and that he'd sooner have you in it than behind him.
    [elif flag.asgeir_patron && fate.asgeir_falls]
    Ásgeir sends for you. He sits by his fire with his bad leg up on a stool and his ruined hand in his lap. "Steinarr has her," he says. "He's no fool, whatever I said in Ireland. Row for him one more summer, at the front. I've told the jarl your name. Let him hear it again from other men."
    [elif flag.asgeir_patron]
    Ásgeir is mustering on the jarl's landing. "The prow," he says, when he sees you, before you can ask. "One more summer where I can see you. Then we'll talk to the jarl."
    [elif flag.bg_steinarr]
    Steinarr has the Raven now. He is mustering on the jarl's landing, and he hasn't sent for you. You can go and stand in front of him, or you can find some other way west.
    [else]
    Ásgeir is mustering on the jarl's landing again. He'll take you back on the same bench, at the same share. Or you can find some other way west.
    [/if]
  choices:
    - id: prow
      text: Take the prow of the Raven. The first man ashore, and a share and a half.
      visible_if: { any: [flag.bg_acclaimed, flag.asgeir_patron, flag.i_first, flag.bg_front] }
      effects: [ { shares: 1.5 }, { set: flag.prow_man }, { route: [orkney, iona, bangor] }, { if: "!nickname && flag.bg_acclaimed", then: [ { nickname: Raven } ] } ]
      result: |
        You walk down to the landing and up the gangplank and forward, past the benches, to the prow, and put your sea-chest under the dragon's neck.

        "First ashore," says Bersi, behind you, cheerfully. "First into the wall. First the Irish see. They'll write songs about you. Short ones."

        "You're in the prow," says Ulf. "You've always been in the prow."
    - id: ask
      text: Go to the jarl yourself and ask for his old karvi.
      check: { skill: speech, attr: pre, difficulty: 7 }
      success:
        text: |
          The jarl keeps you waiting half a morning, and then hears you out with his chin on his fist.

          "You talk well," he says at last. "So did a lot of men I buried young." He doesn't smile. "No. But I'll remember you came. Two summers at an oar, and men already know your name; come back after the second one, and we'll see whose name it is."
        effects: [ { set: flag.jarl_promise }, { favour: 1 }, { route: [orkney, iona, bangor] } ]
      failure:
        text: |
          The jarl hears you out, and then laughs, not unkindly. "One summer at an oar," he says, "and he wants a ship. Come back when you've had three."

          You go back down to the landing. There is still a bench.
        effects: [ { route: [orkney, iona, bangor] } ]
    - id: bench
      text: Take your oar again. One more summer on another man's bench.
      effects: [ { route: [orkney, iona, bangor] }, { add: { man.ketill.loyalty: 1 } } ]
      result: |
        You walk down to the landing and find your bench, and put your chest under it.

        "Sensible," says Bersi. "The middle men live longer."

        "Nobody ever made a song about the middle men," says Ulf.

# Keeping the boast to his father (boasts.yaml: father_silver).
- id: sp_father
  kind: phase
  trigger: phase_start
  once: true
  requires: ["year >= 831", "place == home_fjord", "phase == muster", "boast.father_silver == 1", "silver >= 72"]
  art: home_fjord
  when: Spring, 831
  title: Your father's hand
  text: |
    Your father is mending the byre roof, the way he does every spring, swearing at it the way he does every spring.

    You swore over the jarl's horn that you would put a pound and a half of silver in his hand. You have it.
  choices:
    - id: give
      text: Climb up and give it to him.
      effects: [ { add: { silver: -72 } }, { keep_boast: father_silver }, { set: flag.father_paid } ]
      result: |
        You climb up beside him and hold it out: a pound and a half, weighed out on the jarl's own scales so there can be no argument.

        He looks at it a long time without taking it. Then he takes it, and puts it inside his shirt, and goes on mending the roof.

        "The cow," he says, after a while, "was a good cow." That's all. It's enough. At the Thing that spring, he tells everyone.
    - id: later
      text: Not yet. The summer may need it.
      result: You leave him on the roof. There is still time. There is always still time, until the year turns.
