# Regional sea events (docs/FRAME-HOSTS-FRISIA.md §Regional events): where the ship is bound decides the sea.

# ---- the Frisian coast ----
- id: rg_flats
  kind: pool
  trigger: sea
  chance: 0.25
  cooldown_days: 120
  requires: ["year >= 832", "bound.people == frisian", "!service"]
  art: open_sea
  title: The flats
  text: |
    The tide goes out from under you between one breath and the next. One moment there's a fathom of brown water under the keel; the next there's sand, and the ship settles on it with a long groan and lies over on her side, and the sea is a grey line a mile off and getting further.

    A Frisian is walking toward you across the flats, barefoot, with a basket of cockles, as if this happened every day. To him, it does.
  choices:
    - id: wait
      text: Sit it out. The tide always comes back.
      effects: [ { days: 1 } ]
      result: It does, in the night, all at once, faster than a horse can run, and lifts the ship off the sand as if she weighed nothing. You lose a day, and a little dignity.
    - id: frisian
      text: Pay the cockle-man to show you the channels.
      requires: ["silver >= 6"]
      effects: [ { add: { silver: -6 } }, { progress: 1 } ]
      result: He takes your silver without surprise and walks ahead of the ship when the tide comes back, waist-deep, pointing. You'd never have found the channel. You'd never have known it was there.
    - id: dig
      text: Get the men over the side and drag her.
      check: { skill: seamanship, attr: str, difficulty: 4 }
      success:
        text: Twenty men hauling, up to their knees in sucking mud, and she comes off the bank and into the channel just as the tide turns. The men are filthy and proud of themselves.
        effects: [ { add: { crew.morale: 1 } } ]
      failure:
        text: She doesn't move. The men do, mostly downward, into the mud. You wait for the tide anyway, and now everyone's filthy.
        effects: [ { days: 1 }, { add: { crew.morale: -1 } } ]

# ---- Danish waters ----
- id: rg_horik
  kind: pool
  trigger: sea
  chance: 0.2
  cooldown_days: 200
  requires: ["year >= 832", "bound.people == danish", "!service"]
  art: open_sea
  title: The king's ship
  text: |
    A big ship with a gilded vane and a red-and-white sail comes out from behind an island and lies across your course, and a man in the bow in a good cloak hails you in the king's name.

    King Horik's sea-reeve. Every ship that passes the king's islands pays the king's peace, he says. Or doesn't pass.
  choices:
    - id: pay
      text: Pay the king's peace.
      requires: ["silver >= 12"]
      effects: [ { add: { silver: -12 } }, { standing: { people: danish, n: 1 } } ]
      result: He weighs it on scales that are probably honest, gives you a little bronze token stamped with a ship, and tells you to show it at Hedeby. The Danes are a tidy people.
    - id: name
      text: Tell him your name, and Ubbi's.
      requires: [{ any: [flag.ubbi_done, "captain.ubbi.rel >= 3"] }]
      effects: [ { standing: { people: danish, n: 1 } } ]
      result: The sea-reeve's face changes. "Ubbi's Norwegian," he says, and laughs. "Go on, then." The red-and-white sail swings away.
    - id: run
      text: Crowd on sail and go round him.
      danger: true
      check: { skill: seamanship, attr: wit, difficulty: 5 }
      success:
        text: You go round him in a squall, close under the island, closer than he dares follow. Behind you he's shouting your name, which means he's learned it.
        effects: [ { standing: { people: danish, n: -1 } } ]
      failure:
        text: His ship is faster, and his men are king's men. You pay in the end, twice over, and the whole king's ship laughs at you.
        effects: [ { add: { silver: -24 } }, { standing: { people: danish, n: -1 } } ]

- id: rg_pilot
  kind: pool
  trigger: sea
  chance: 0.15
  cooldown_days: 200
  requires: ["year >= 832", "bound.people == danish || bound.people == swedish || bound.people == frisian"]
  art: open_sea
  title: A pilot
  text: |
    A little boat comes alongside at dawn with an old man in it, and he climbs aboard without being asked and sits down by the steering-oar as if he owned it.

    He knows these waters, he says: every bank, every rock, every channel between every island from here to wherever you're going. He'd like a little silver, and a lot of ale, and a lift home after.
  choices:
    - id: hire
      text: Give him the steering-oar.
      visible_if: "!service"
      requires: ["silver >= 6"]
      effects: [ { add: { silver: -6, skill.seamanship: 1 } }, { progress: 1 } ]
      result: He takes you through channels you'd never have dared, singing, and drinks a cask of your ale doing it, and leaves you a day ahead of where you'd have been and a good deal wiser about the Danish islands.
    - id: no
      text: Thank him, and put him back in his boat.
      visible_if: "!service"
      result: He goes without complaint. He'll be in some other ship's stern by noon, singing.
    # at the oar: {captain} gives him the steering-oar, and you sit nearest it
    - id: learn
      text: "{captain} takes him on. Sit by the steering-oar, and keep his cup full, and listen."
      visible_if: service
      effects: [ { add: { skill.seamanship: 1 } }, { progress: 1 } ]
      result: He takes you through channels you'd never have dared, singing, and between the songs he tells you every bank and rock and channel from here to Jutland, because you keep his cup full and nobody else listens. You remember most of it.
    - id: oar
      text: Leave him to {captain}, and keep rowing.
      visible_if: service
      effects: [ { progress: 1 } ]
      result: The old man takes the ship through the islands, singing, and drinks a cask of {captain}'s ale doing it. You row.

# ---- the Irish Sea ----
- id: rg_turgeis
  kind: pool
  trigger: sea
  chance: 0.2
  cooldown_days: 300
  requires: ["bound.people == gael", "year >= 834"]
  art: open_sea
  title: Turgeis's sails
  text: |
    Sails to the south: one, and then a dozen, and then too many to count, going north up the Irish coast in a long line with the wind behind them.

    Norse ships. Not Danes: you can tell by the sails, and by the way they keep their line. A fleet like that in the Irish Sea means one man. Turgeis. The one who means to be king of all the Norse in Ireland, and then of the Irish too.
  choices:
    - id: watch
      text: Lie off and watch them go by.
      visible_if: "!service"
      effects: [ { add: { skill.lore: 1 } }, { set: flag.rg_saw_turgeis } ]
      result: It takes them half the afternoon to go by. Sixty ships, Hallvard says, counting on his fingers. Eighty. Somebody else says a hundred. You'll be telling it at Yule, and it'll be two hundred by then.
    - id: hail
      text: Close and hail them, and find out what they want with Ireland.
      visible_if: "!service"
      check: { skill: speech, attr: pre, difficulty: 5 }
      success:
        text: |
          A long ship drops back to look at you. The man in her stern is lean and grey and very still, and he asks who you are, and listens to the answer as if he were weighing it. He doesn't give his own name. He doesn't need to. "Ireland is mine," he says pleasantly. "Come and help me take it, if you like. Or keep out of my way." The long ship goes back to its place in the line.
        effects: [ { set: flag.rg_met_turgeis }, { add: { skill.lore: 1 } } ]
      failure:
        text: Three ships drop back out of the line toward you, with shields along their rails, and you decide very quickly that you didn't want to know after all.
        effects: [ { add: { crew.morale: -1 } } ]
    # at the oar: {captain} lies off to watch; you count
    - id: count
      text: "{captain} lies off to let them pass. Count the ships, and mark the men in them."
      visible_if: service
      effects: [ { add: { skill.lore: 1 } }, { set: flag.rg_saw_turgeis } ]
      result: It takes them half the afternoon to go by. You count sixty-two, and the men on the benches argue about it till dark. {captain} asks you for the number at the evening meal, and then repeats it at every port as his own.

- id: rg_pilgrims
  kind: pool
  trigger: sea
  chance: 0.15
  cooldown_days: 300
  requires: ["year >= 832", "bound.people == gael"]
  art: open_sea
  title: The pilgrims
  text: |
    A curragh, far out from land: a frame of laths with hides stretched over it, and in it six men in brown, rowing very slowly, singing, with no sail, and no food that you can see, and no idea at all of where the nearest land is.

    Irish monks. Going out into the ocean for God, to find an island to pray on, or to drown. Either will do, apparently.
  choices:
    - id: rob
      text: There's nothing to rob. Leave them.
      visible_if: "!service"
      result: You leave them to God and the sea. Some of your men watch them out of sight. One of them, an Islesman with an Irish mother, crosses himself, and then looks round quickly to see if anybody saw.
    - id: food
      text: Throw them a cask of water and some dried fish.
      visible_if: "!service"
      effects: [ { add: { provisions: -10, hamingja: 1 } } ]
      result: They bless you, all six of them, solemnly, with their hands raised, and then go on rowing into nothing. Whatever their god is, he's had his eye on you now.
    - id: take
      text: Take them aboard. Monks sell.
      visible_if: "!service"
      effects: [ { captives: 6 }, { add: { honour: -1 } } ]
      result: They come aboard without a fight. They go on singing in the bilge all the way to market, and nobody can make them stop.
    # at the oar: {captain} is already measuring them for the slave-market
    - id: speak
      text: "Tell {captain} the old men say it's bad luck to take a holy man off the sea."
      visible_if: service
      check: { skill: lore, attr: pre, difficulty: 5 }
      success:
        text: |
          {captain} hesitates. Half the benches are nodding, and sailors are sailors. In the end he has them thrown a cask of water and some dried fish instead, and they bless the ship, all six of them, with their hands raised, and row on into nothing. The men look at you differently for the rest of the voyage, some of them better and some of them worse.
        effects: [ { add: { hamingja: 1 } } ]
      failure:
        text: |
          "Bad luck for them," {captain} says, and takes them aboard. They go on singing in the bilge all the way to market. Every time they start, the man on the next bench looks at you.
    - id: let
      text: Keep your mouth shut. Monks sell, and you'll have your share.
      visible_if: service
      effects: [ { add: { honour: -1 } } ]
      result: They come aboard without a fight. At the next market {captain} sells them, and your share is a few coins of silver. They sang all the way there.

# ---- the new waters (docs/FRAME-PLACES-2.md) ----
- id: rg_stad
  kind: pool
  trigger: sea
  chance: 0.5
  cooldown_days: 200
  requires: ["bound == hladir || place == hladir", "!service"]
  art: storm
  title: Rounding Stad
  text: |
    Stad is the headland every sailor on this coast talks about the way old women talk about a bad son: a great wall of rock sticking out into the open sea, with no shelter on either side of it, and the swell coming in from the west with nothing to stop it all the way from the edge of the world.

    The wind is getting up. Your steersman looks at the sky, and at the headland, and at you.
  choices:
    - id: round
      text: Round it now, before it gets worse.
      check: { skill: seamanship, attr: wit, difficulty: 5 }
      success:
        text: It's bad, off the point. The ship climbs every wave like a horse at a wall and comes down the other side like a dropped stone. But she comes round, and in the lee of it the sea goes flat as a pond, and the men laugh the way men laugh when they've been afraid.
        effects: [ { add: { crew.morale: 1, skill.seamanship: 1 } } ]
      failure:
        text: Halfway round, a sea comes over the bow and takes two men and half the stores with it. You get round. You don't get them back.
        effects: [ { add: { crew.men: -2, provisions: -60, crew.morale: -1 } } ]
    - id: wait
      text: Haul up in the last cove and wait for the weather.
      effects: [ { days: 3 } ]
      result: Three days in a cove that smells of seaweed, eating dried fish and listening to the sea beat on Stad. Then the wind drops, and you round it in an afternoon, and nobody admits they were glad you waited.

- id: rg_baltic
  kind: pool
  trigger: sea
  chance: 0.15
  cooldown_days: 200
  requires: ["bound.people == baltic || bound == gotland", "!service"]
  art: open_sea
  title: Small boats
  text: |
    They come out from behind a low island at dawn: six boats, small, fast, low in the water, with a dozen men in each and their shields laid along the sides. Kurs, your steersman says, from the coast to the east. They've been raiding the Swedes for longer than the Swedes have been raiding anyone else.

    They don't attack. Not yet. They spread out, two on each side and two behind, and keep pace with you, and wait to see what you'll do.
  choices:
    - id: fight
      text: Turn on the nearest boat before the others close.
      danger: true
      effects: [ { battle: { foe: island_men, men: 24, terrain: ship } } ]
      result: You put the helm over and go straight at them, and they come in from every side at once, which is what they wanted.
    - id: run
      text: Crack on sail and run for open water.
      check: { skill: seamanship, attr: wit, difficulty: 5 }
      success:
        text: They follow you half the day, and then, one by one, they turn back toward the land. They were waiting for you to be stupid. You weren't.
      failure:
        text: Small boats are fast. They catch you at dusk, and swarm aboard from three sides, and by the time you've thrown them off again, two of your men are dead and the stores are short.
        effects: [ { add: { crew.men: -2, provisions: -40, crew.morale: -1 } } ]
    - id: pay
      text: Hold up a bag of silver, and see if they take it.
      requires: ["silver >= 24"]
      effects: [ { add: { silver: -24, crew.morale: -1 } } ]
      result: They take it, and wave, and go. Your men don't look at you for a while.

- id: rg_channel
  kind: pool
  trigger: sea
  chance: 0.15
  cooldown_days: 200
  requires: ["year >= 832", "bound.people == english || bound.people == frankish", "!service"]
  art: open_sea
  title: The coastguard
  text: |
    The Narrow Sea is full of ships, and one of them isn't a trader. She comes out of a river mouth on the Frankish side under oars, long and low, with a cross on her sail and mailed men along her sides. The old emperor set guard-ships on these coasts, your steersman says, and the new one has kept a few of them.

    She means to look at you. If she doesn't like what she sees, she has friends up the river.
  choices:
    - id: trader
      text: Cover the shields, show them a trader's face, and talk.
      check: { skill: trade, attr: pre, difficulty: 5 }
      success:
        text: Their captain comes aboard, looks at your cargo, which is mostly ballast, and at your men, who are mostly trying to look like merchants. He takes a toll and a cask of your ale and goes away, and you can't tell whether he believed you or just didn't want the fight.
        effects: [ { add: { silver: -6 } } ]
      failure:
        text: Their captain takes one look at your men and blows a horn, and you run, with the guard-ship on your tail and two more coming out of the river behind it. You get away. Every port on this coast will know your sail now.
        effects: [ { standing: { people: frankish, n: -1 } }, { days: 1 } ]
    - id: fight
      text: Run out the oars, and take her.
      danger: true
      effects: [ { battle: { foe: frankish_levy, men: 22, terrain: ship } } ]
      result: She sees you coming, and doesn't run. Franks don't, much.
    - id: avoid
      text: Stand out to sea, and give the coast a wide berth.
      effects: [ { days: 1 } ]
      result: You lose a day in the open water, and the guard-ship follows you to the edge of sight and then turns back, satisfied.

- id: rg_salt
  kind: pool
  trigger: sea
  chance: 0.3
  cooldown_days: 200
  requires: ["bound == noirmoutier || bound == nantes", "!service"]
  art: open_sea
  title: The salt-boats
  text: |
    Off the mouth of the Loire you come on the salt-boats: a dozen fat little craft, low in the water with sacks of grey salt, going up the river to Nantes on the flood tide. Their crews are farmers and boys. They see your sail and scatter like hens.
  choices:
    - id: take
      text: Take the nearest three, and their salt.
      effects: [ { add: { loot: 50 } }, { standing: { people: frankish, n: -1 } } ]
      result: It's barely a fight. The boys jump over the side and swim for the shore, and you take the boats and the salt and leave the boats on the sand, empty. Salt sells well in the north. Every winter, every farm, every barrel of herring.
    - id: let
      text: Let them go. They're not worth the trouble.
      result: They don't believe it. They keep looking back at you all the way up the river, waiting for the trick.
