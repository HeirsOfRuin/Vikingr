# Spring 832 (docs/FRAME-831.md §2.6): the written story pauses here; the sandbox carries on.
- id: sp_832
  kind: phase
  trigger: phase_start
  once: true
  requires: ["year >= 832", "place == home_fjord", "phase == muster", seen.j_council]
  art: muster
  when: Spring, 832
  title: The third spring
  text: |
    The ice goes out again. It always does. You are eighteen.
    [if flag.married_gyda || flag.gyda_eloped]
    Gyða walks down to the landing with you in the grey before dawn, with her cloak pulled tight and her hand in yours, and doesn't say anything sentimental, because she never does.
    [/if]
    [if service]
    {captain} is mustering on the jarl's landing again. Your place is waiting. So, if you go and ask for it, is the jarl.
    [else]
    {ship} is waiting on the landing, tarred and ready, and the men are coming down from the farms with their sea-chests to see who's going west this year, and on whose ship. More of them come to yours than came last year.
    [/if]
    [if service && flag.jarl_promise || service && flag.h_jarl_trust || service && flag.asgeir_patron]
    Two summers ago the jarl said: come back after the second one. This is after the second one.
    [/if]
    [break]
    Two years ago you were a second son with a borrowed shield. Now the district has a name for you, and the name has a story behind it, and the story is still being told.
    [if flag.ubbi_sworn]
    Somewhere south, at Hedeby, a Dane called Ubbi is counting ships for Frisia, and one of the ships he is counting is yours.
    [/if]
    [if flag.sk_land_offer]
    On Skye, a woman with forearms like a smith's is waiting to see whether you come back.
    [/if]
    [if flag.c_ransomed || flag.c_king_kept]
    In Ireland, a king remembers your face.
    [/if]
    [if flag.c_ulaid_feud]
    In Ireland, they are telling the story of the king in his own doorway, and they are not telling it kindly.
    [/if]
  choices:
    - id: sail
      text: Go down to the ship.
      visible_if: "!service"
      effects: [ { set: flag.sp832_done } ]
      result: |
        The written saga pauses here, at the turn of your third spring. The sea does not: you can sail on, raid, trade and winter as long as you live, and every deed you do will be told.
    - id: promised
      text: Go to the jarl, and remind him what he said.
      visible_if: { all: [service, { any: [flag.jarl_promise, flag.h_jarl_trust, flag.asgeir_patron] }] }
      effects:
          - { ship: { type: karvi, name: "The jarl's old karvi", crew: 12 } }
          - { set: flag.owes_jarl }
          - { set: flag.sp832_done }
          - { keep_boast: own_ship }
          - { if: "man.ketill.loyalty >= 4", then: [ { man: { id: ketill, swear: true } } ], else: [ { man: { id: ketill, leave: true } } ] }
          - { if: "man.ulf.loyalty >= 5", then: [ { man: { id: ulf, swear: true } } ], else: [ { man: { id: ulf, leave: true } } ] }
          - { if: "man.hallvard.loyalty >= 5", then: [ { man: { id: hallvard, swear: true } } ], else: [ { man: { id: hallvard, leave: true } } ] }
          - { if: "man.bersi.loyalty >= 5", then: [ { man: { id: bersi, swear: true } } ], else: [ { man: { id: bersi, leave: true } } ] }
      result: |
        He doesn't keep you waiting this time. He walks you down to the end of his landing himself, to an old karvi drawn up under a turf shelter, twenty-eight oars and a patched sail, with new tar on her that he must have ordered in the winter.

        "I said two summers," he says. "I meant two summers. A quarter of what she brings home. Lose her, and you'll row for me till you've paid for her. Keep her, and we'll talk about something bigger."

        You are eighteen. She's yours. The written saga pauses here, at the turn of your third spring. The sea does not.
    - id: jarl
      text: Go to the jarl, with your name and your story, and ask for a ship.
      visible_if: { all: [service, "!flag.jarl_promise", "!flag.h_jarl_trust", "!flag.asgeir_patron"] }
      check: { skill: speech, attr: pre, difficulty: 3 }
      success:
        text: |
          The jarl hears you out, and this time he doesn't laugh. "Two summers at an oar," he says, "and men already know your name. Take the old karvi. A quarter of what she brings home, and if you lose her, you'll row for me till you've paid for her."

          The written saga pauses here, at the turn of your third spring. The sea does not.
        effects:
          - { ship: { type: karvi, name: "The jarl's old karvi", crew: 12 } }
          - { set: flag.owes_jarl }
          - { set: flag.sp832_done }
          - { keep_boast: own_ship }
          - { if: "man.ketill.loyalty >= 4", then: [ { man: { id: ketill, swear: true } } ], else: [ { man: { id: ketill, leave: true } } ] }
          - { if: "man.ulf.loyalty >= 5", then: [ { man: { id: ulf, swear: true } } ], else: [ { man: { id: ulf, leave: true } } ] }
          - { if: "man.hallvard.loyalty >= 5", then: [ { man: { id: hallvard, swear: true } } ], else: [ { man: { id: hallvard, leave: true } } ] }
          - { if: "man.bersi.loyalty >= 5", then: [ { man: { id: bersi, swear: true } } ], else: [ { man: { id: bersi, leave: true } } ] }
      failure:
        text: |
          "Next year," the jarl says. You go back down to your bench.

          The written saga pauses here, at the turn of your third spring. The sea does not.
        effects: [ { set: flag.sp832_done } ]
    - id: buy
      text: Weigh out four pounds for a karvi of your own, owing nobody.
      visible_if: service
      requires: ["silver >= 192"]
      effects:
          - { add: { silver: -192 } }
          - { ship: { type: karvi, name: Grey Goose, crew: 8 } }
          - { set: flag.sp832_done }
          - { keep_boast: own_ship }
          - { if: "man.ketill.loyalty >= 4", then: [ { man: { id: ketill, swear: true } } ], else: [ { man: { id: ketill, leave: true } } ] }
          - { if: "man.ulf.loyalty >= 5", then: [ { man: { id: ulf, swear: true } } ], else: [ { man: { id: ulf, leave: true } } ] }
          - { if: "man.hallvard.loyalty >= 5", then: [ { man: { id: hallvard, swear: true } } ], else: [ { man: { id: hallvard, leave: true } } ] }
          - { if: "man.bersi.loyalty >= 5", then: [ { man: { id: bersi, swear: true } } ], else: [ { man: { id: bersi, leave: true } } ] }
      result: |
        She's old and she's slow, and the farmer down the fjord who sells her to you cries when you take her away, which makes you wonder what he knows. But she's yours, and nobody else's, and she owes nobody a quarter of anything. Two summers of shares, every coin of it, weighed out on a farmer's scales.

        You call her the Grey Goose, because she is grey, and because she waddles. The written saga pauses here, at the turn of your third spring. The sea does not.
    - id: bench
      text: Take your oar again.
      visible_if: service
      effects: [ { set: flag.sp832_done } ]
      result: |
        You find your bench and put your chest under it. It's the same bench. You aren't the same man.

        The written saga pauses here, at the turn of your third spring. The sea does not.
