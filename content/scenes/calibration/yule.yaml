# CALIBRATION SCENE 3 of 3: Yule 830, the flyting (FRAME-PHASE2 §2.7).
# Written as a chain of scenes with checks; the flyting system (Phase 2 §4.3) will replace the plumbing,
# not the voice. The hall's noise (flag.cal_hall, 0-2) drives the crowd in the picture.
- id: cal_yule
  kind: spine
  calibration: true
  art: { key: yule_hall, laughter: flag.cal_hall }
  title: Yule
  text: |
    Jarl Eystein's hall at Yule is so full of smoke and bodies and noise that the walls seem to lean outward. There is a boar on the spit, and ale strong enough to stand a spoon in, and three dogs fighting over something under the high table that may once have been a goose.

    Ulf has told the story of the summer four times since the boar came in. Each time he is in it more. By the fourth telling he took Iona more or less alone, with you holding his cloak.

    Ketill drinks steadily and says nothing. Bersi is counting the jarl's silver cups with his eyes. Hallvard is watching the smoke-hole as if something might come down it.
    [break]
    Then Thorgils Hrappsson stands up on his bench.

    He is a big man, red in the face from the fire and the ale, with a voice made for shouting at cattle. The hall goes quiet the way a hall does when it smells a fight coming.

    "Look at him," says Thorgils, and points at you with a rib-bone. "Hall's second son. Went west with Ásgeir for silver. Came home with a sunburn and a cough. I hear the monks of Iona were so frightened of him that they finished their prayers before they ran."

    Somebody laughs. Then a few more. Every face in the hall turns to see what you'll do.
  choices:
    - id: insult
      text: Answer with something about Thorgils.
      check: { skill: speech, attr: wit, difficulty: 4 }
      success:
        text: |
          "Better a sunburn than what you brought back from Kaupang, Thorgils. The girls there still talk about you." You let it hang. "Not for long, mind. Nothing about you takes long."

          The hall roars. Ulf falls off the bench. Thorgils goes a darker red, which you would not have said was possible.
        effects: [ { add: { flag.cal_score: 1, flag.cal_hall: 2 } } ]
        next: cal_yule_2
      failure:
        text: |
          "Better a sunburn than... than whatever you've got, Thorgils."

          It comes out wrong, too quick and too quiet. Thorgils cups a hand to his ear. "What's that? Speak up, boy. You sound like the monks."

          The hall laughs, and not with you.
        effects: [ { add: { flag.cal_hall: 1 } } ]
        next: cal_yule_2
    - id: boast
      text: Tell the hall what you did at Iona.
      check: { skill: speech, attr: pre, difficulty: 4 }
      success:
        text: |
          You stand. You are taller than you were in the spring, and the hall sees it.

          "I was over the wall at Iona while Thorgils was over the side of his father's boat, feeding his breakfast to the fish. Ask Ásgeir's men who was first. Ask the monks, if you can find one."

          A growl of approval goes round the benches. Somebody bangs a cup on the table, then everybody does.
        effects: [ { add: { flag.cal_score: 1, flag.cal_hall: 1 } } ]
        next: cal_yule_2
      failure:
        text: |
          You stand. "At Iona I was..."

          "Sitting on a rock," says Thorgils. "Minding a cow. We heard." He has done his asking about. The hall howls.
        effects: [ { add: { flag.cal_hall: 2 } } ]
        next: cal_yule_2
    - id: turn
      text: Turn it on your bench-mates. Let Ulf answer.
      check: { skill: command, attr: pre, difficulty: 3 }
      success:
        text: |
          "Ulf. How many oars did Thorgils pull last summer?"

          Ulf, who has been waiting his whole life for this question, climbs onto the table. "He pulled the one his mother handed him," he says, "and he's still not sure which end goes in the water."

          The hall roars. You raise your cup to Ulf. It was your joke; the hall knows whose it was.
        effects: [ { add: { flag.cal_score: 1, flag.cal_hall: 2 } } ]
        next: cal_yule_2
      failure:
        text: |
          "Ulf. Tell them how many oars Thorgils pulled last summer."

          Ulf opens his mouth, then shuts it. He is very drunk. "Was it... two?"

          "He sends his men to fight for him," Thorgils tells the hall. "Even the talking."
        effects: [ { add: { flag.cal_hall: 1 } } ]
        next: cal_yule_2
    - id: laugh
      text: Laugh, as if it were a good joke, and drink.
      effects: [ { add: { flag.cal_hall: 1 } } ]
      result: |
        You laugh and raise your cup to him. A few men laugh with you. More of them are watching to see whether Thorgils is done.

        He isn't.
      next: cal_yule_2

- id: cal_yule_2
  kind: spine
  art: { key: yule_hall, laughter: flag.cal_hall }
  title: Yule
  text: |
    Thorgils waits for the noise to settle. He has done this before. He takes a long drink, wipes his mouth on his sleeve, and starts again, slower.

    "A second son," he says, "is a man who eats what his brother leaves in the pot. Twenty winters of cold porridge, and now he goes a-viking to find something warm to eat. I'd go too, boy. But I've got a farm."
  choices:
    - id: insult
      text: Give him the farm back with interest.
      check: { skill: speech, attr: wit, difficulty: 5 }
      success:
        text: |
          "You've got a farm," you agree. "Three cows, a wet field and a wife who sleeps in the byre to get away from you. Your cows are the only things on it that have seen the sea. They swam for it."

          It goes round the hall like fire through dry heather. Even the jarl laughs, and the jarl laughs about once a winter.
        effects: [ { add: { flag.cal_score: 1, flag.cal_hall: 2 } } ]
        next: cal_yule_ahead
      failure:
        text: |
          "At least I..." You can feel it go wrong before it's out. "At least I don't... have a farm."

          There is a pause in which you could hear a feather land.

          "He's proud of it," says Thorgils. "Proud of having nothing. Give him a cup, somebody. He's earned that much."
        effects: [ { add: { flag.cal_hall: 2 } } ]
        next: cal_yule_behind
    - id: porridge
      text: Agree with him, and make the porridge your own.
      check: { skill: speech, attr: pre, difficulty: 4 }
      success:
        text: |
          "Cold porridge," you say. "Every winter. My brother's leavings." You put a hand on your heart. "That's why I can row from Hordaland to Orkney without stopping, Thorgils, and you get out of breath climbing onto your bench."

          The hall loves a man who can take a blow and give one back. They pound the tables. Somebody starts a chant of "Por-ridge! Por-ridge!", and it is, somehow, on your side.
        effects: [ { add: { flag.cal_score: 1, flag.cal_hall: 2 } } ]
        next: cal_yule_ahead
      failure:
        text: |
          "Cold porridge," you say. "It made me strong."

          "It made you short," says Thorgils, and the hall, which has been waiting for something it can repeat, takes up the chant. "Por-ridge! Por-ridge!" It is not on your side.
        effects: [ { add: { flag.cal_hall: 2 } } ]
        next: cal_yule_behind
    - id: silent
      text: Say nothing. Hold his eye until he looks away.
      check: { skill: weapons, attr: pre, difficulty: 5 }
      success:
        text: |
          You don't answer. You look at him. You keep looking.

          The hall goes quiet again, a different kind of quiet. Thorgils laughs, but it comes out thin, and he is the one who looks away first, at his cup.
        effects: [ { add: { flag.cal_score: 1 } } ]
        next: cal_yule_ahead
      failure:
        text: |
          You don't answer. You look at him.

          Thorgils looks back, and yawns, enormously, and the hall laughs at the yawn.
        effects: [ { add: { flag.cal_hall: 1 } } ]
        next: cal_yule_behind

- id: cal_yule_ahead
  kind: spine
  art: { key: yule_hall, laughter: flag.cal_hall }
  title: Yule
  text: |
    Thorgils is losing, and he knows it, and a man who is losing a flyting does one of two things. He sits down, or he goes too far.

    He goes too far.

    "Hall's boy," he says, loud and ugly. "Your father had two sons, and the second came out the wrong end of the wrong woman. Ask your mother who she was keeping warm the winter Hall was in Ireland."

    The laughter stops as if somebody had cut its throat. Ketill puts his cup down. Ulf has stopped grinning. On the high seat, the jarl leans forward to see what you'll do.
  choices:
    - id: finish
      text: Finish it with words. Make the hall laugh at him one last time.
      check: { skill: speech, attr: wit, difficulty: 4 }
      success:
        text: |
          "Thorgils," you say, quite gently, "when a man runs out of things to say about me, and starts on my mother, it's because he's run out of things to say about himself. Sit down. You've lost, and the ale's getting warm."

          For a heartbeat nobody moves. Then the jarl laughs, a big bark of a laugh, and the whole hall comes down on Thorgils like a wave. He sits. Somebody throws a crust at him.

          By the time the ale runs out, the hall has a name for you. They are calling you Hvassi: the Sharp. Ulf says it most, and loudest, and he means it.
        effects: [ { deed: { type: deed, text: Won the Yule flyting against Thorgils Hrappsson, weight: 3 } }, { add: { flag.cal_hall: 2 } } ]
      failure:
        text: |
          You start well, and then it gets away from you, and you hear yourself say something about his mother in return, and it's a poor thing beside his.

          The hall doesn't laugh. It mutters. Thorgils grins, because a draw is the best he could hope for now, and he knows it.
    - id: hit
      text: Put down your cup. Tell him to say it again, outside, with a shield on his arm.
      danger: true
      effects: [ { fight: { foe: thorgils, kind: holmgang, lethal: true, win: cal_yule_holm_won, lose: cal_yule_holm_lost } } ]
      result: |
        The jarl does not stop it. A thing like that, said in front of a hall, can only be answered on the cloak. They peg it out on the frozen turf behind the hall, by torchlight, with the whole of Yule watching, breathing smoke.
    - id: jarl
      text: Look to the jarl. It's his hall and his peace.
      result: |
        Jarl Eystein lets the silence go on just long enough for everyone to feel it. Then he says, "Thorgils. Sit down, or go home."

        Thorgils sits. The hall breathes out. You won, and everyone saw you win, and everyone also saw who ended it. It isn't quite the same thing.

- id: cal_yule_behind
  kind: spine
  art: { key: yule_hall, laughter: flag.cal_hall }
  title: Yule
  text: |
    The hall is laughing, and it is laughing at you. Thorgils has the room in his hand. He spreads his arms like a skald at the end of a good verse.

    "No more?" he says. "Nothing? The great raider of Iona, beaten by a farmer with a cup of ale." He sits down, grinning, and the noise rolls on over your head.

    Ulf won't look at you. Bersi is looking at you as if he's working out what you're worth now. Ketill pushes his own cup across the table to you.
  choices:
    - id: last
      text: One more try. Stand up and win the hall back.
      check: { skill: speech, attr: pre, difficulty: 6 }
      success:
        text: |
          You stand on the bench. It takes a while for them to see you. Then you say, "Thorgils is right. I'm a second son, and I eat porridge, and I went west and came home with a cough. And next summer I'm going west again, and he'll still be here, telling you about it."

          It isn't a joke. It lands like one anyway. Somebody shouts "Porridge!" and this time it's a cheer.

          By the end of the night the name has stuck, and so has the cheer. They call you Grautr: Porridge. It sounds like an insult, and it isn't, quite.
        effects: [ { add: { flag.cal_hall: 2 } } ]
      failure:
        text: |
          You stand on the bench. Nobody turns round. You sit down again.

          By the end of the night the name has stuck. They call you Grautr: Porridge. Thorgils says it most, and loudest, and he means it.
    - id: hit
      text: Thorgils has made you a joke. Make him bleed for it, on the cloak.
      danger: true
      effects: [ { fight: { foe: thorgils, kind: holmgang, lethal: true, win: cal_yule_holm_won, lose: cal_yule_holm_lost } } ]
      result: |
        "Holmgang," you say, and the hall goes quiet. "Tomorrow. Or tonight, if you're not too drunk."

        "Tonight," says Thorgils. He is still grinning, but his eyes have changed. They peg out the cloak on the frozen turf behind the hall, by torchlight.
    - id: drink
      text: Drink Ketill's ale. There will be other winters.
      result: |
        You drink Ketill's ale. Then you drink your own.

        "Every man who ever got a name," says Ketill, under the noise, "got laughed at first." He thinks about it. "Not every man who got laughed at got a name."

        By the end of the night they are calling you Grautr: Porridge. You decide that one day it will sound like a threat.

- id: cal_yule_holm_won
  kind: spine
  art: holmgang
  title: The cloak
  text: |
    Thorgils is down on the trampled snow, and the snow under him is going black in the torchlight. He is alive. He will keep the leg, probably. He will not stand on a bench to talk about you again.

    The jarl's men carry him off. Somebody puts a cloak round your shoulders, and somebody else a cup in your hand, and it's a while before you notice that your hands won't stop shaking.

    Nobody calls you anything that night. They don't need to. Your name will do.
  choices:
    - id: in
      text: Go back inside.
      effects: [ { deed: { type: holmgang_won, text: Beat Thorgils Hrappsson on the cloak at Yule } } ]
      result: The hall goes quiet when you come in, then louder than before. Ulf is already telling it, and in his version you are taller.

- id: cal_yule_holm_lost
  kind: spine
  art: holmgang
  title: The cloak
  text: |
    You are on your back in the snow, and the sky is full of sparks from the torches, and Thorgils is standing over you breathing hard.

    He could finish it. Everyone is waiting to see if he will. He looks at the jarl, and at the hall, and spits in the snow beside your head.

    "Porridge," he says, and walks away.
  choices:
    - id: up
      text: Get up.
      result: It takes you three tries. Nobody helps, except Ketill, who waits until nobody is looking.
