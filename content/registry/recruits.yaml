# Where new sworn men come from (docs/FRAME-HIRD-HOSTAGES.md). A recruiting scene names its origin;
# the man is made when the scene opens. {he} in a description is his name.
- id: bench
  names: norse
  temperaments: [steady, hot, greedy, pious, ambitious, dour]
  weapons: [2, 3]
  loyalty: [5, 7]
  descs:
    - "{he} has pulled an oar behind you for two summers and never once asked for anything. Now he is asking."
    - "{he} was the one who held the gap at the last fight, when two others ran. The men noticed. So did you."
    - "{he} is quiet, broad and very hard to knock down. He sings badly and fights well."
    - "{he} has a scar from ear to jaw that he got in your service, and wants something to show for it besides the scar."
    - "{he} came to the benches as a boy with no beard. He has one now, and opinions."

# the oarsman who took a fallen sworn man's bench: he keeps the name the scenes already gave him
