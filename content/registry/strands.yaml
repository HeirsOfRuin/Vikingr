# The shore between the ports (playtest 10: "the point was to attack the coasts and settlements in-between listed
# ports on the map"). Harrying a coast finds unnamed settlements, drawn from these kinds and the people who live
# there. men and wealth are ranges before the coast's alarm; food is man-days of cattle and stores taken.
kinds:
  - id: hamlet
    label: a fishing hamlet
    desc: [ "Six or seven turf-roofed houses above the tide-line, boats drawn up on the shingle, nets drying on poles.", "A cluster of huts in a cove, smoke from two of them, a woman on the beach gutting fish who hasn't seen you yet." ]
    men: [4, 10]
    wealth: [50, 120]
    food: 6
    defenders: local
    goods: catch
    terrain: beach
    weight: 4
  - id: farm
    label: a big farm
    desc: [ "A long hall with its byres and barns round a yard, cattle in the home-field, a track up from the landing-place.", "A rich farm at the head of a little bay: a hall, a mill, sheep on the hill behind." ]
    men: [8, 18]
    wealth: [100, 240]
    food: 12
    defenders: local
    goods: farm
    terrain: field
    weight: 4
  - id: church
    label: a church
    desc: [ "A small stone church with a bell-tower, a priest's house and a graveyard, above a village at the river mouth.", "A cell of a few monks on a headland, with a chapel and a guest-house for pilgrims." ]
    men: [3, 10]
    wealth: [180, 450]
    food: 4
    defenders: church
    goods: market
    terrain: beach
    weight: 3
    christian: true
  - id: village
    label: a market village
    desc: [ "A street of houses along a creek, with a market-place, warehouses on the water and boats from up the coast.", "A village where a road meets the shore, with a weekly market and a reeve's house bigger than the rest." ]
    men: [14, 28]
    wealth: [240, 560]
    food: 8
    defenders: local
    goods: market
    terrain: beach
    weight: 2
  - id: hall
    label: a lord's hall
    desc: [ "A lord's hall behind a bank and palisade, his household's horses in the paddock, his boats on the strand.", "A thegn's estate: a great hall, a chapel, barns, and armed men about the yard who have seen your sails." ]
    men: [22, 40]
    wealth: [320, 800]
    food: 10
    defenders: lord
    goods: farm
    terrain: rampart
    weight: 1
    arms: true
# The peoples' shores: who stands, and what their stores hold. A people not listed is not harried (the Norse coasts).
peoples:
  frankish: { local: island_men, church: monks_tenants, lord: frankish_levy, catch: salt, farm: grain, market: wine }
  frisian: { local: island_men, church: monks_tenants, lord: frisian_levy, catch: stockfish, farm: wool, market: wool }
  english: { local: island_men, church: monks_tenants, lord: english_fyrd, catch: stockfish, farm: wool, market: wool }
  gael: { local: island_men, church: monks_tenants, lord: ulster_levy, catch: stockfish, farm: hides, market: hides }
  pict: { local: island_men, church: monks_tenants, lord: pictish_host, catch: stockfish, farm: hides, market: wool }
  briton: { local: island_men, church: monks_tenants, lord: strathclyde_men, catch: stockfish, farm: hides, market: wool }
  baltic: { local: island_men, church: island_men, lord: gotlanders, catch: stockfish, farm: amber, market: furs }
