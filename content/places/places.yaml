  - { id: paris, name: "Parísborg", lon: 2.35, lat: 48.85, people: frankish, kind: town, region: The Seine, desc: "Paris: the Franks' old city on its island in the Seine, ringed with abbeys.", rumour: "The Franks' old city on an island in the Seine, he says, far up the river, with more churches than houses, and the richest abbey in Frankia a morning's ride away. Nobody has been up the Seine that far with a ship. Yet.", active: true, tells: [saint_denis], raid: { wealth: 5000, defenders: 200, foe: frankish_levy, terrain: field } }
  # ---- the third batch: England, Scotland, Ireland, the Seine (docs/FRAME-IRELAND-SEINE.md) ----
  - { id: jarrow, name: "Jarrow", lon: -1.47, lat: 54.98, people: english, kind: monastery, region: Northumbria, desc: "Bede's monastery on the Tyne.", rumour: "A monastery on the Tyne, he says, where the wisest man the English ever had wrote his books. Raided once, before your father's time, and the raiders' leader died for it. The monks still talk about that.", active: true, tells: [lindisfarne, whitby], raid: { wealth: 900, defenders: 18, foe: northumbrian_levy, terrain: beach } }
  - { id: whitby, name: "Streoneshalh", lon: -0.61, lat: 54.49, people: english, kind: monastery, region: Northumbria, desc: "Whitby: an old double house of monks and nuns on a cliff above the sea.", rumour: "A minster on a cliff over the sea, south of the Tyne, he says, where the English kings decided once whether to keep Easter like the Irish or like the Romans. They chose the Romans. The Irish still haven't forgiven them.", active: true, tells: [york], raid: { wealth: 700, defenders: 16, foe: northumbrian_levy, terrain: beach } }
  - { id: gipeswic, name: "Gipeswic", lon: 1.16, lat: 52.05, people: english, kind: market, region: East Anglia, desc: "Ipswich: the East Angles' wic on the Orwell, all potters' kilns and jetties.", rumour: "The East Angles' market on a river south of the fens, he says, where they make pots by the thousand and send them everywhere. A king's town, with a king who has no navy worth the name.", standing: -1, active: true, market: true, tells: [sheppey], trade: { cheap: [wool, grain], dear: [furs, whetstones, soapstone, wine] }, raid: { wealth: 1100, defenders: 32, foe: english_fyrd, terrain: field } }
  - { id: hamwic, name: "Hamwic", lon: -1.39, lat: 50.9, people: english, kind: market, region: Wessex, desc: "Southampton: the West Saxon king's trading town on the Itchen.", rumour: "The West Saxon king's market on the south coast, he says, facing Frankia, with a grid of streets and a thousand people, and the wine coming in from Rouen every summer.", standing: -1, active: true, market: true, tells: [rouen], trade: { cheap: [wool, glass], dear: [furs, whetstones, amber, ivory, falcons] }, raid: { wealth: 1600, defenders: 60, foe: english_fyrd, terrain: field } }
  - { id: applecross, name: "Apurcrossan", lon: -5.81, lat: 57.43, people: gael, kind: monastery, region: Wester Ross, desc: "Applecross: Máel Rubai's monastery on the mainland shore opposite Skye.", rumour: "A monastery on the mainland shore across the sound from Skye, he says, founded by an Irish saint, under mountains that come straight down to the sea. Poor, and holy, and a long way from anybody who'd defend it.", active: true, art: celtic_monastery, tells: [skye], raid: { wealth: 450, defenders: 10, foe: monks_tenants, terrain: beach } }
  - { id: tarbat, name: "Tarbat", lon: -3.79, lat: 57.83, people: pict, kind: monastery, region: Pictland, desc: "Portmahomack: a Pictish monastery on the Moray Firth, with a workshop that makes vellum and silver.", rumour: "A Pictish monastery on the Moray Firth, he says, south of Orkney, with carved stones as tall as two men and a workshop where they make books and church plate. The Picts are not the Irish. They fight in the open, and they have horses.", active: true, tells: [orkney], raid: { wealth: 1000, defenders: 26, foe: pictish_host, terrain: field } }
  - { id: whithorn, name: "Hvítaærn", lon: -4.42, lat: 54.73, people: english, kind: monastery, region: Galloway, desc: "Whithorn: the White House of Saint Ninian, an English bishop's seat among Britons and Irish.", rumour: "The White House, he says, on the Galloway shore across from Man: the oldest church in all that country, where an English bishop sits among people who aren't English, and the pilgrims come by sea.", standing: -1, active: true, art: celtic_monastery, tells: [man], raid: { wealth: 800, defenders: 18, foe: monks_tenants, terrain: beach } }
  - { id: alt_clut, name: "Alt Clut", lon: -4.58, lat: 55.94, people: briton, kind: hall, region: Strathclyde, desc: "Dumbarton Rock: the Briton kings' fortress on the Clyde.", rumour: "The Briton king's fortress, he says, on a rock in the mouth of the Clyde like a giant's tooth, and his whole kingdom up the valley behind it. Nobody has ever taken it. Nobody has really tried.", active: true, tells: [iona], raid: { wealth: 1800, defenders: 70, foe: strathclyde_men, terrain: field } }
  - { id: linn_duachaill, name: "Linn Duachaill", lon: -6.34, lat: 53.88, people: gael, kind: town, region: Ireland, desc: "Annagassan: a river mouth on the bay south of Conaille, where the Norse will build a ship-fort in 841.", rumour: "A river mouth south of the bay at Conaille, he says, with a deep pool and good ground behind it, and the whole midlands of Ireland a few days' march inland.", standing: -2, active: true, tells: [conaille, dublin], trade: { cheap: [wool, grain], dear: [wine, salt, whetstones] }, raid: { wealth: 500, defenders: 20, foe: conaille_men, terrain: beach } }
  - { id: rechru, name: "Rechru", lon: -6.25, lat: 55.2, people: gael, kind: island, region: Ulster, desc: "Rathlin: the little island off the Ulster coast where the Northmen first came to Ireland, in 795.", rumour: "An island off the north coast of Ulster, he says, where the first of our ships burned a church thirty-five years ago. There's a church there again. The Irish are stubborn.", standing: -2, active: true, art: celtic_monastery, tells: [bangor], raid: { wealth: 350, defenders: 8, foe: monks_tenants, terrain: beach } }
  - { id: glendalough, name: "Glendalough", lon: -6.33, lat: 53.01, people: gael, kind: monastery, region: Ireland, desc: "The monastery of the two lakes, in the Wicklow mountains.", rumour: "A monastery in a valley of two lakes, he says, two days' march into the mountains south of the Liffey. Saint Kevin's. Rich with the gifts of Leinster kings, and the kings bury their dead there.", standing: -2, active: true, raid: { wealth: 1400, defenders: 30, foe: leinster_men, terrain: field } }
  - { id: cork, name: "Corcach", lon: -8.47, lat: 51.9, people: gael, kind: monastery, region: Munster, desc: "Cork: Saint Finbarr's monastery in the marshes of the Lee.", rumour: "A great monastery in the marsh at the head of a long harbour, he says, on the south coast of Ireland, facing Frankia. The wine ships come in there. So could we.", standing: -2, active: true, tells: [skellig], rumours: [noirmoutier], raid: { wealth: 1100, defenders: 26, foe: munster_men, terrain: beach } }
  - { id: skellig, name: "Sceilig Mhichíl", lon: -10.3, lat: 51.85, people: gael, kind: monastery, region: Munster, desc: "Skellig Michael: a hermitage on a rock in the Atlantic, six hundred steps above the sea.", rumour: "A rock in the ocean off the end of Ireland, he says, where monks live in stone beehives on ledges above the sea, closer to their god than any man should be. Somebody took their abbot off it when you were a boy, and he starved to death in a ship. They're still there.", standing: -2, active: true, art: celtic_monastery, tells: [cork], raid: { wealth: 150, defenders: 4, foe: monks_tenants, terrain: beach } }
  - { id: jumieges, name: "Jumièges", lon: 0.82, lat: 49.43, people: frankish, kind: monastery, region: The Seine, desc: "A great abbey in a loop of the Seine below Rouen.", rumour: "A great abbey in a bend of the Seine below Rouen, he says, with nine hundred monks and servants in its best days, and a king's gifts on its altars.", active: true, tells: [rouen], raid: { wealth: 1500, defenders: 22, foe: monks_tenants, terrain: beach } }
  - { id: fontenelle, name: "Fontenelle", lon: 0.73, lat: 49.53, people: frankish, kind: monastery, region: The Seine, desc: "Saint-Wandrille: an old abbey in a side valley of the Seine.", rumour: "An abbey up a side valley off the Seine, he says, rich and old, with an abbot who would rather pay than burn.", active: true, tells: [rouen], raid: { wealth: 1300, defenders: 20, foe: monks_tenants, terrain: beach } }
  - { id: saint_denis, name: "Saint-Denis", lon: 2.36, lat: 48.94, people: frankish, kind: monastery, region: The Seine, desc: "The abbey where the Frankish kings are buried, a morning's ride north of Paris.", rumour: "The abbey where the Frankish kings go to be buried, he says, north of Paris: the richest house in all Frankia, with an abbot who is the king's own cousin.", active: true, tells: [paris], raid: { wealth: 3200, defenders: 60, foe: frankish_levy, terrain: field } }

