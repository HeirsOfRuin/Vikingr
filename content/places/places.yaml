  - { id: faroes, name: "Færeyjar", lon: -6.8, lat: 62.0, people: norse, kind: island, standing: 1, active: true, rumours: [island], region: The Atlantic, desc: "The Faroes. Sheep islands at the edge of the known sea.", rumour: "Sheep islands, he says, three days north-west of Hjaltland over open sea, where the Irish hermits went to be alone with their god, and a man from Agder is said to have taken land. Birds so thick on the cliffs they darken the sky.", trade: { cheap: [wool, down], dear: [grain, salt, whetstones] } }
  # Iceland (docs/FRAME-LINEAGE.md E). The dates follow the Landnámabók tradition: Naddoddr and Garðarr in the 860s,
  # Flóki's winter, Ingólfr at Reykjarvík in 874, the land-taking from about 870.
  - { id: island, name: "Ísland", lon: -21.9, lat: 64.15, people: norse, kind: island, standing: 1, active: true, region: Iceland, from: 860, trade_from: 874, landnam: 870, tells: [breidafjordr], desc: "Iceland: a great island at the edge of the world, all ice and fire and grass. Men called it Snæland and Garðarshólmr first; Flóki gave it the name that stuck.", rumour: "A land far out in the west beyond the Faroes, he says, as big as Ireland and empty: snow on the mountains, smoke out of the ground, grass to a horse's belly in the valleys, and nobody there but a few Irish hermits who won't live among heathens. Naddoddr found it, blown off course. Garðarr sailed round it. Nobody has stayed yet.", trade: { cheap: [ivory, wool, down, falcons], dear: [grain, salt, wine, glass, whetstones] } }
  - { id: breidafjordr, name: "Breiðafjörðr", lon: -23.0, lat: 65.05, people: norse, kind: island, standing: 1, active: true, region: Iceland, from: 860, landnam: 870, desc: "The broad fjord on Iceland's west coast: islands past counting, seals and eider, and good grass behind the shore. Flóki wintered at its northern end and lost his cattle to the cold." }
  - { id: man, name: "Mön", lon: -4.55, lat: 54.23, people: gael, kind: island, region: The Irish Sea, desc: "The Isle of Man, between Ireland and Britain.", rumour: "An island in the middle of the Irish Sea, he says, with a king of its own, and good harbours, and a man who holds it holds the sea between Ireland and Britain.", standing: -1, active: true, tells: [dublin, whithorn], raid: { wealth: 550, defenders: 18, foe: island_men, terrain: beach } }
  - { id: dublin, name: "Dyflinn", lon: -6.27, lat: 53.34, people: gael, kind: town, region: Ireland, desc: "The black pool on the Liffey.", rumour: "The black pool on the Liffey, where the Irish have a fort and a ford. A good harbour, he says, for a man who meant to stay the winter in Ireland. Nobody has, yet.", standing: -2, active: true, tells: [man, conaille], rumours: [clonmacnoise, glendalough, cork], trade: { cheap: [wool, grain], dear: [wine, salt, whetstones, soapstone, glass] }, raid: { wealth: 900, defenders: 30, foe: leinster_men, terrain: field } }
  - { id: armagh, name: "Armagh", lon: -6.65, lat: 54.35, people: gael, kind: monastery, region: Ireland, desc: "The chief church of the Irish.", rumour: "The chief church of all the Irish, inland from the bay at Conaille. Saint Patrick's own house. The richest church in Ireland, and it knows it.", standing: -2, active: true, art: iona_dawn, raid: { wealth: 2200, defenders: 70, foe: airgialla_men, terrain: field } }
  - { id: clonmacnoise, name: "Clonmacnoise", lon: -7.99, lat: 53.33, people: gael, kind: monastery, region: Ireland, desc: "A great monastery on the Shannon.", rumour: "A great monastery on the Shannon in the middle of Ireland, so far from the sea that the monks think they're safe. A ship that could get up the Shannon would find out if they're right.", standing: -2, active: true, raid: { wealth: 2000, defenders: 48, foe: clonmacnoise_men, terrain: field } }
  - { id: york, name: "Jórvík", lon: -1.08, lat: 53.96, people: english, kind: town, standing: -1, region: Northumbria, desc: "The Northumbrian kings' city on the Ouse.", rumour: "The Northumbrian king's city on the Ouse, with a minster and a market and walls the Romans built. Too big for one ship. Not too big for a fleet.", active: true, market: true, tells: [sheppey, lindisfarne], rumours: [sheppey, whitby], trade: { cheap: [wool, grain], dear: [wine, furs, whetstones, soapstone, falcons] }, raid: { wealth: 3000, defenders: 120, foe: northumbrian_levy, terrain: field } }
  - { id: sheppey, name: "Sheppey", lon: 0.85, lat: 51.4, people: english, kind: island, region: Kent, desc: "Sheep island in the Thames mouth, with a minster on it.", rumour: "An island in the mouth of the Thames, he says, all sheep and marsh and a minster of nuns on the hill, founded by a queen. The London ships go past it every tide.", active: true, tells: [london, walcheren, gipeswic, hamwic], raid: { wealth: 850, defenders: 20, foe: kentish_men, terrain: beach } }
  - { id: london, name: "Lundenwic", lon: -0.1, lat: 51.51, people: english, kind: market, region: Mercia, desc: "The market on the Thames.", rumour: "The Mercian king's market on the Thames, he says, a long strand of jetties and workshops outside the old Roman walls, where the Frisians bring wine and take wool, and the king's reeve takes a toll off both.", standing: -1, active: true, market: true, tells: [sheppey], trade: { cheap: [wool, grain, glass], dear: [furs, ivory, amber, whetstones, falcons] }, raid: { wealth: 2400, defenders: 70, foe: london_reeve, terrain: field } }
  - { id: dorestad, name: "Dorestad", lon: 5.34, lat: 51.97, people: frisian, kind: market, region: Frisia, desc: "The richest market of the Frankish north.", rumour: "The richest market of the Franks, on the Rhine, so rich they say the streets are paved with broken pots. The emperor's sons are fighting each other, and nobody is guarding it.", standing: 0, active: true, market: true, trade: { cheap: [wine, glass, grain, salt], dear: [furs, ivory, amber, down, whetstones] }, raid: { wealth: 4200, defenders: 110, foe: frisian_levy, terrain: field }, rumours: [london, york] }
  - { id: walcheren, name: "Walcheren", lon: 3.6, lat: 51.5, people: frisian, kind: island, region: Frisia, desc: "An island in the Scheldt mouth.", rumour: "An island in the mouths of the Scheldt, he says, flat as a table, with a church and a count's tollhouse, and the Frisian ships going past it all summer to the markets up the rivers.", standing: 0, active: true, raid: { wealth: 700, defenders: 24, foe: frisian_levy, terrain: beach }, rumours: [noirmoutier, rouen], tells: [sheppey] }
