  # Aquitaine (docs/FRAME-FLEET-843.md §3): the Garonne city the Loire Northmen besieged in 847 and took in 848.
  - { id: bordeaux, name: "Burdegala", lon: -0.58, lat: 44.84, people: frankish, kind: town, region: Aquitaine, desc: "Bordeaux: the old Roman city on the Garonne, the seat of the dukes of Gascony.", rumour: "A walled city up a great river to the south, he says, past the salt marshes and the pine country: Roman walls, a duke, a bishop, and the wine of all Aquitaine going down the river past it to the sea.", active: true, market: true, trade: { cheap: [wine, salt], dear: [furs, amber, ivory, whetstones] }, raid: { wealth: 3200, defenders: 90, foe: frankish_levy, terrain: field } }
  - { id: nantes, name: "Nantes", lon: -1.55, lat: 47.22, people: frankish, kind: town, region: Frankia, desc: "A city on the Loire.", rumour: "A walled city on the Loire, a day upriver from the salt islands, with a bishop and a count and a cathedral, and the wine of half of Frankia coming down the river past it.", active: true, market: true, tells: [noirmoutier], rumours: [rouen, paris], trade: { cheap: [wine, salt, glass], dear: [furs, amber, ivory, whetstones] }, raid: { wealth: 2400, defenders: 64, foe: frankish_levy, terrain: field } }
