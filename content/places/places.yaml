# Places and sea legs. lon/lat are real coordinates; the validator checks each
# place sits on land (or on the coast) of the generated map.
# active: false = on the map for later phases, not yet reachable.
places:
  - id: home_fjord
    name: Hordaland
    lon: 5.55
    lat: 60.15
    kind: home
    art: home_fjord
    region: West Norway
    desc: The home fjord. Steep sides, thin fields, good timber, and too many sons for the land.
    known: true
    active: true
  - id: karmoy
    name: Avaldsnes
    lon: 5.28
    lat: 59.35
    kind: hall
    region: West Norway
    desc: A king's seat on Karmøy, above the strait every ship going north has to pass.
    known: true
    active: true
    market: true
  - id: shetland
    name: Hjaltland
    lon: -1.28
    lat: 60.14
    kind: island
    region: The Northern Isles
    desc: Shetland. Wind, peat, sheep, and Norse farms on the old Pictish ones. Two days west with a fair wind.
    known: true
    active: true
  - id: orkney
    name: Orkneyjar
    lon: -3.27
    lat: 59.13
    kind: hall
    art: birsay
    region: The Northern Isles
    desc: Orkney. Green islands, a chieftain's hall, and men who know the way south to the monasteries.
    known: true
    active: true
  - id: iona
    name: Iona
    lon: -6.41
    lat: 56.33
    kind: monastery
    art: iona_dawn
    region: The Hebrides
    desc: Colum Cille's island. Raided before your father's time and again since, and still the monks come back.
    known: false
    active: true
    raid: { wealth: 288, defenders: 14, foe: monks_tenants, terrain: beach }
  - id: bangor
    name: Bangor
    lon: -5.67
    lat: 54.66
    kind: monastery
    art: bangor_field
    region: Ulster
    desc: A great house of the Irish monks on Belfast Lough, with a king's levy close enough to come.
    known: false
    active: true
    raid: { wealth: 480, defenders: 28, foe: ulster_levy, terrain: field }
